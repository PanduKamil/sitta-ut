<!DOCTYPE html>
<html>
<head>
    <meta charset=""UTF-8>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informasi Stok - SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="lebar">
        <a href="dashboard.html">&larr; kembali ke Dashboard</a>
        <h1>Informasi Stok Bahan Ajar</h1>
        <button type="button" id="btnTambah">Tambah Stok</button>
        <table> 
            <thead>
                <tr>
                    <th>Sampul</th>
                    <th>Kode Lokasi</th>
                    <th>Kode Barang</th>
                    <th>Nama Barang</th>
                    <th>Jenis</th>
                    <th>Edisi</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody id="tbStok"></tbody>
        </table>
    </main>
    <div id="modalTambah" class="modal">
        <div class="box">
            <span class="close" id="tutupTambahStok">&times;</span>
            <h2>Tambah Stok baru</h2>
            <form id="formStok">
                <label for="stkLokasi">Kode Lokasi:</label>
                <input type="text" id="stkLokasi" name="stkLokasi">
                <p class="msg" id="errStkLokasi"></p>

                <label for="stkKode">Kode Barang:</label>
                <input type="text" id="stkKode" name="stkKode">
                <p class="msg" id="errStkKode"></p>

                <label for="stkNama">Nama Barang:</label>
                <input type="text" id="stkNama" name="stkNama">
                <p class="msg" id="errStkNama"></p>

                <label for="stkJenis">Jenis Barang:</label>
                <select id="stkJenis" name="stkJenis">
                    <option value="BMP">BMP</option>
                    <option value="NBMP">NBMP</option>
                </select>

                <label for="stkEdisi">Edisi:</label>
                <input type="text" id="stkEdisi" name="stkEdisi">
                <p class="msg" id="errStkEdisi"></p>

                <label for="stok">Stok:</label>
                <input type="number" id="stok" name="stok">
                <p class="msg" id="errStok"></p>

                <button type="submit">Simpan</button>
                <button type="button" id="btnBatal">Batal</button>
            </form>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/stok.js"></script>
</body>
</html>
