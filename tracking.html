<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tracking Pengiriman - SITTA</title>
        <link rel="stylesheet" href="css/style.css">
        <style>
            .bar{ height: 12px; background: #d5dbe4; border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
            .bar-isi{ height: 100%; background: #9784b9; }
            .timeline{list-style: none; padding: 0 0 0 1.2rem; margin: 1rem; border-left: 3px solid #9784b9; position: relative;}
            .timeline li{margin-bottom: 0.9rem; position: relative;}
            .timeline small{display: block; font-size: 0.8rem; color: #5b6b7d;}
        </style>

    </head>
    <body>
            <main class="lebar">
                <a href="dashboard.html" class="btn-kembali">Kembali ke Dashboard</a>
                <h1>Tracking Pengiriman</h1>

                <form id="formCari" novalidate>
                    <label for="nomorDO">Nomor Delivery Order:</label>
                    <input type="text" id="nomorDO" placeholder="Contoh: 2023001234" >
                    <p class="msg" id="errNomorDO"></p>
                    <button type="submit">Lacak</button>
                </form>

                <section id="hasil" hidden>
                    <h2 id="rNama"></h2>
                    <p id="rStatus"></p>
                    <div class="bar"><div class="bar-isi" id="rBar"></div></div>
                    <dl>
                        <h3>Perjalanan paket</h3>
                        <ul class="timeline" id="rJalan"></ul>
                        <dt>Ekspedisi:</dt>
                        <dd id="rEkspedisi"></dd>
                        <dt>Tanggal Kirim:</dt>
                        <dd id="rTanggal"></dd>
                        <dt>Jenis Paket:</dt>
                        <dd id="rJenis"></dd>
                        <dt>Total Pembayaran:</dt>
                        <dd id="rTotal"></dd>
                    </dl>
                </section>
            </main>
            <script src="js/data.js"></script>
            <script src="js/tracking.js"></script>
    </body>
</html>
